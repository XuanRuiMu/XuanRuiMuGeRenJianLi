name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install Python 依赖
        # 打包与自检脚本需要 Pillow，版本按实测可用钉住
        run: python -m pip install --disable-pip-version-check "pillow==12.3.0"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install Python 依赖
        # 打包与自检脚本需要 Pillow，版本按实测可用钉住
        run: python -m pip install --disable-pip-version-check "pillow==12.3.0"

      - name: Install dependencies
        run: npm ci

      - name: 同步 GitHub 仓库快照
        # 构建期同步 GitHub 快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:github

      - name: Build
        run: npm run build

      - name: 佐证材料 dist 防泄漏守卫
        # 构建后检查 dist 是否泄漏佐证材料

        run: npx vitest run scripts/打包佐证材料.test.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
