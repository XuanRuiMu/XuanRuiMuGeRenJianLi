server:
  port: 8080

spring:
  application:
    name: resume-matcher
  # 默认 H2 内存库，零依赖即可本地运行；设置 MYSQL_HOST 等环境变量或启用 mysql profile 切换 MySQL 8
  datasource:
    url: jdbc:h2:mem:matcher;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  llm:
    # 环境变量注入，无 key 时自动降级为本地规则匹配引擎
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: 30
  cache:
    # true 时使用 Redis（连接 localhost:6379），false 时降级 Caffeine 内存缓存
    redis-enabled: ${REDIS_ENABLED:false}
    cache-ttl-minutes: 10
  rate-limit:
    # 每 IP 每分钟最大请求数（计数器存于 Redis 或内存缓存）
    requests-per-minute: 20

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:resume_matcher}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
