# ============================================================================
# 玄锐暮个人简历站 · 腾讯云服务器部署模板（FP-05 AI 密钥同源代理）
# ----------------------------------------------------------------------------
# 部署对象：`npm run build` 的产物 dist/（纯静态，无 Node 运行时）
# 放置方式：cp deploy/nginx.conf /etc/nginx/conf.d/xuanrui-mu-resume.conf
#          本文件按 conf.d 片段编写（顶层即 http 上下文），所以 limit_req_zone 直接写在顶部；
#          若改用 sites-available + nginx.conf 里 include，请自行把 limit_req_zone 挪到 http 段。
# 生效前必做：nginx -t && systemctl reload nginx
#
# 核心原则：前端产物里不存在任何密钥。
#   浏览器只请求同源相对路径 /api/ai/*（见 src/ai/deepseekConfig.ts 的 DEEPSEEK_ENDPOINT），
#   真实密钥由本文件的 proxy_set_header 注入，所以 dist 可以放心公开：
#   访客 F12 能看到的只有 "/api/ai/deepseek" 这一个路径。
#   开发环境的同一职责由 vite.config.js 的 server/preview 代理承担（loadEnv 读 .env.local）。
#
# 需要改占位的地方：server_name、证书路径、root 路径、/etc/nginx/snippets/ai-keys.conf。
# ============================================================================

# ---- 限流：AI 端点花的是你自己的额度 -----------------------------------------
# 同源代理保住了密钥，但 /api/ai/deepseek 本身成了公网可调的开放中继——
# 这是密钥不出前端后剩下的唯一风险面，必须限速。1r/s + burst 3 够真人连续对话，
# 不够脚本刷额度；被限流的请求回 429，前端（src/ai/chatService.ts）会静默回退本地引擎，
# 不会崩、不会弹错误文案。要更严可加 IP 白名单或换成付费网关，但那超出静态站的范围。
limit_req_zone $binary_remote_addr zone=ai:10m rate=1r/s;
limit_req_status 429;

# ---- 密钥放哪：nginx 配置不读系统环境变量，也不支持 ${VAR} 替换 ----------------
# 把密钥单独放进一个 include 文件，用 set 指令声明成 nginx 变量，内容只有两行：
#     set $deepseek_key "sk-你的DeepSeek密钥";
#     set $glm_key      "你的GLM密钥";
#   chown root:root /etc/nginx/snippets/ai-keys.conf
#   chmod 600       /etc/nginx/snippets/ai-keys.conf
# 该文件禁止进 git 仓库、禁止进备份包、禁止放进 dist。
# 轮换密钥只改这一个文件再 reload，前端产物无需重新构建。
# （已进过 dist 的旧密钥必须先去两家后台作废重发——构建产物可能已被人抓包留存。）

# ---- HTTP → HTTPS -----------------------------------------------------------
# 公网必须 HTTPS：明文传输时代理注入的密钥、访客的对话内容都会在同一网段裸奔，
# 且摄像头/剪贴板等能力在非安全上下文下不可用。
server {
    listen 80;
    server_name resume.example.com;                 # TODO 换成你的域名（或公网 IP）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                                        # nginx < 1.25.1 改写为：listen 443 ssl http2;
    server_name resume.example.com;                  # TODO

    ssl_certificate     /etc/letsencrypt/live/resume.example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/resume.example.com/privkey.pem;     # TODO
    ssl_protocols       TLSv1.2 TLSv1.3;

    # dist 目录内容直接放 root 下（index.html、assets/、sw.js、manifest.json、佐证材料.zip …）
    root  /var/www/xuanruimu-resume/dist;            # TODO
    index index.html;
    charset utf-8;

    # ---- 通用安全响应头 ------------------------------------------------------
    # nginx 的 add_header 不逐级合并：子级一旦出现 add_header，就整体丢弃父级的全部 add_header。
    # 本文件下面带 add_header 的 location（/sw.js、/index.html、/assets/、图片字体、/api/ai/*、zip）
    # 需要在各自块里再 include 一次下面这个 4 行片段，才能同时保留这些头：
    #     /etc/nginx/snippets/security-headers.conf
    #         add_header X-Content-Type-Options "nosniff" always;
    #         add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #         add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #         add_header X-Frame-Options "SAMEORIGIN" always;
    # 为保持模板开箱即跑，这里只在 server 级声明一次，不强制你建第二个文件。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 站内有指向 B 站/外部项目的跳转链接（那是出站，不受影响）；
    # 若确认永远不需要被别人内嵌，可再收紧为 Content-Security-Policy "frame-ancestors 'none'"。

    # ---- 压缩：文本压，二进制不压 --------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # ---- 缓存：PWA 换代依赖 index.html 与 sw.js 不被缓存 ----------------------
    # sw.js 一旦被 CDN/浏览器缓存住，Service Worker 换代就会滞后，用户永远拿不到新版本。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # 产物文件名带内容哈希，可永久强缓存
    # ^~ 必须有：nginx 的正则 location（下面那条 ~* \.(png|woff2|…)$）优先级高于普通前缀匹配，
    # 不加 ^~ 时 /assets/*.png、/assets/*.woff2 会被正则块抢走，实际拿到 max-age=604800 而非 immutable 强缓存。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # 图片/字体/视频等 public 原样资源：中等时长，别用 immutable（这些文件名不带哈希）
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|woff2?|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ============================================================================
    # AI 同源反代：全服务器唯一出现密钥的地方
    # ============================================================================

    # DeepSeek（OpenAI 兼容）：前端唯一在用的模型通道
    location = /api/ai/deepseek {
        include /etc/nginx/snippets/ai-keys.conf;    # 提供 set $deepseek_key ...
        limit_req zone=ai burst=3 nodelay;

        # AI 消息里的图片是 base64 data URL（见 src/ai/chatService.ts 的 到Api消息），
        # 一张手机照片编码后可轻松超过 nginx 默认的 1m 请求体上限 → 413。
        client_max_body_size 20m;

        proxy_pass https://api.deepseek.com/v1/chat/completions;
        proxy_http_version 1.1;
        proxy_set_header Host api.deepseek.com;
        proxy_ssl_server_name on;                    # 开 SNI，否则上游 TLS 证书校验/路由会出问题
        proxy_ssl_name api.deepseek.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer $deepseek_key";
        # 转发 Content-Type / Accept 由 nginx 透传原请求头，SSE 无需额外声明。

        # ---- 流式（SSE）关键三件套 ------------------------------------------
        # AI 助手是打字机式流式输出。nginx 默认会把上游响应整段缓冲完再吐给浏览器，
        # 表现为「等十几秒后一次刷出全文」，流式语义名存实亡，
        # 且容易在长回答上撞 read_timeout。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;                                    # 别在中间层重新成块
        add_header X-Accel-Buffering no always;      # 前面再套 CDN/SLB 时，让下一跳也关缓冲
        proxy_read_timeout 300s;                     # 思考档 max 的单轮可远超默认 60s
        proxy_send_timeout 300s;
        proxy_next_upstream off;                     # 失败不自动重试上游，避免同一请求重复计费
        # 日志说明：nginx 只记请求行/状态/UA，不记请求体与请求头，
        # 所以密钥与对话内容都不会进 access.log；这里保留日志用于观察刷量来源。
    }

    # GLM（Anthropic 兼容）：预留通道——当前 src/ai/models.ts 的模型列表只含 DeepSeek，
    # 前端不会请求这个路径。接入时把模型端点指到 /api/ai/glm 即可，本段无需改动。
    location = /api/ai/glm {
        include /etc/nginx/snippets/ai-keys.conf;    # 提供 set $glm_key ...
        limit_req zone=ai burst=3 nodelay;
        client_max_body_size 20m;

        proxy_pass https://open.bigmodel.cn/api/anthropic/v1/messages;
        proxy_http_version 1.1;
        proxy_set_header Host open.bigmodel.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name open.bigmodel.cn;
        proxy_set_header Connection "";
        # .env.example 里 GLM 密钥对应终端的 ANTHROPIC_AUTH_TOKEN，语义是 Bearer 头；
        # 若上游要求 Anthropic 规范里的 x-api-key 头名，把下一行换成
        #     proxy_set_header x-api-key $glm_key;
        # （以一次真实 curl 为准，不要凭印象改。）
        proxy_set_header Authorization "Bearer $glm_key";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }

    # 兜底：任何未定义的同源 /api/* 一律 404。
    # 绝不能让它落到下面的 SPA try_files —— 那样 /api/xxx 会返回 200 + index.html，
    # 前端只会静默回退本地兜底，线上表现为「AI 助手永远不用大模型」，极难定位。
    location /api/ {
        return 404;
    }

    # ============================================================================
    # 访客计数 /api/analytics 的替代方案
    # ----------------------------------------------------------------------------
    # 现状：functions/api/analytics.ts 是 Cloudflare Pages Functions 形态（依赖 KV 绑定），
    #       搬到腾讯云后这条路径无人应答 → 404。
    #       前端 src/lib/api.ts 已改为静默降级：404/断网/非 JSON 一律返回 null、不抛错、
    #       不重试（react-query retry: 0），页脚计数保持占位「…」而不是谎报 0，
    #       JS 侧不产生任何 error。
    #       唯一无法由前端消除的是浏览器网络层自己为 404 打的那条 error 日志——
    #       所以「公网版控制台零 error」要求下面三选一：
    #
    #   方案 0（推荐，零后端）：构建时保持 VITE_ENABLE_ANALYTICS=false（.env.example 默认值）。
    #       VisitorCounter 整体不渲染，根本不发这个请求 → 控制台必然零日志。
    #       注意：本地 .env.local 目前是 true，公网构建时别把它带上。
    #   方案 A（要真实数字）：反代到本机一个轻量计数服务（Node/Go，写文件或 Redis），
    #       响应体形状必须是 {"total":number,"last24h":number,"stored":boolean}
    #       （与 dev 的 scripts/dev-api-plugin.js、Cloudflare 版 functions/ 一致）。
    #       代价：多一个常驻进程要维护，且要自己防刷（这里的 zone=ai 可直接复用）。
    #   方案 B（只要路由存在、数字无所谓）：固定回一份空统计。
    #       代价：页脚会显示「访问量：0」，这是一个不真实的展示，给 HR 看不太好——
    #       所以 B 只在「想让计数存在但不想跑后端」时用，并且要清楚它是占位值。
    #
    # 三个方案互斥，默认全部注释 = 按方案 0 部署。
    # ============================================================================

    # 方案 A —— 取消注释并把 8787 换成你的计数服务端口
    # location = /api/analytics {
    #     limit_req zone=ai burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8787/api/analytics;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;   # 计数服务要做 IP 匿名化再落库
    # }

    # 方案 B —— 取消注释即回占位统计（前端拿到 total:0，会显示「访问量：0」）
    # location = /api/analytics {
    #     default_type application/json;
    #     add_header Cache-Control "no-store" always;
    #     return 200 '{"total":0,"last24h":0,"stored":false}';
    # }

    # ============================================================================
    # 佐证材料.zip 下载（public/佐证材料.zip，构建后随 dist 发布，约 4.5MB）
    # ----------------------------------------------------------------------------
    # 前端下载入口用的是 <a href="/佐证材料.zip" download>。
    # download 属性只对**同源** URL 生效：一旦把文件挪到 COS/CDN 跨域直链，
    # 浏览器会忽略 download，退化成「在线打开/按上游 Content-Type 处置」，
    # 中文文件名也可能丢——HR 点下载变成预览，体验直接碎掉。
    # 因此：
    #   1) 首选保持同源（本模板即此方案，zip 跟着 dist 一起发）；
    #   2) 若为省带宽非要上 COS，就必须在 COS 上给该对象设
    #      Content-Disposition: attachment; filename*=UTF-8''%E4%BD%90%E8%AF%81%E6%9D%90%E6%96%99.zip
    #      并配好 CORS，让「另存为」语义由响应头决定，而不是由前端的 download 属性决定。
    # 下面这段即使在前端属性失效时也能兜住：服务端直接声明 attachment。
    # ============================================================================
    location = /佐证材料.zip {
        types { } default_type application/zip;
        # 不带文件名时浏览器自行取 URL 末段；要固定中文名用 RFC 5987：
        # add_header Content-Disposition "attachment; filename=\"evidence.zip\"; filename*=UTF-8''%E4%BD%90%E8%AF%81%E6%9D%90%E6%96%99.zip" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        gzip off;                                    # zip 再压一遍只烧 CPU
        # 该文件已被 vite.config.js 的 injectManifest.globIgnores 排除在 Workbox 预缓存之外，
        # 别在这里加 preload，也别把它塞进 manifest，否则首屏要多下 4.5MB。
        # 注：nginx 用解码后的 URI 匹配 location，所以这里写中文原文即可；
        # 若你的发行版对非 ASCII location 匹配有异常，改成 location ~* \.zip$ 即可等效。
    }

    # ---- SPA 回退 ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与源码映射：*.map 会把全部前端源码公开到公网（本轮改造后不含密钥，
    # 但仍没必要公开）。要保留排障能力就只放在内网/CI 产物里。
    location ~ /\. { deny all; }
    location ~ \.map$ { return 404; }
}
