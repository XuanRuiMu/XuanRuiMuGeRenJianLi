# 玄锐暮简历站 · nginx 部署模板（静态 dist + 同源 AI 代理）
# 放置：/etc/nginx/conf.d/xuanruimu-resume.conf；密钥：/etc/nginx/snippets/ai-keys.conf
# 生效：nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=ai:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name resume.example.com; # TODO 换成你的域名（或公网 IP）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name resume.example.com; # TODO

    ssl_certificate     /etc/letsencrypt/live/resume.example.com/fullchain.pem; # TODO
    ssl_certificate_key /etc/letsencrypt/live/resume.example.com/privkey.pem; # TODO
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/xuanruimu-resume/dist; # TODO
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    location = /服务工作线程.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|woff2?|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /api/ai/deepseek {
        include /etc/nginx/snippets/ai-keys.conf;
        limit_req zone=ai burst=3 nodelay;

        client_max_body_size 20m;

        proxy_pass https://api.deepseek.com/v1/chat/completions;
        proxy_http_version 1.1;
        proxy_set_header Host api.deepseek.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.deepseek.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer $deepseek_key";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }

    location = /api/ai/glm {
        include /etc/nginx/snippets/ai-keys.conf;
        limit_req zone=ai burst=3 nodelay;
        client_max_body_size 20m;

        proxy_pass https://open.bigmodel.cn/api/anthropic/v1/messages;
        proxy_http_version 1.1;
        proxy_set_header Host open.bigmodel.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name open.bigmodel.cn;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer $glm_key";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }

    location /api/ {
        return 404;
    }

    location = /佐证材料.zip {
        types { } default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        gzip off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
    location ~ \.map$ { return 404; }
}
